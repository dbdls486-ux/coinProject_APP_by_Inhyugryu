# 자료 출처 접속 시험용 (probe/ 가 바뀔 때만 돈다)
name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in probe/*.mjs; do echo "=== $f"; node "$f"; done
